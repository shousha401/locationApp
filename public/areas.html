<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Other areas · Location Feed</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#1e293b; --panel2:#172033; --line:#334155;
      --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#22d3ee;
      --good:#34d399; --warn:#fbbf24; --err:#f87171;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    header { display:flex; align-items:center; gap:16px; padding:12px 20px;
      border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { margin:0; font-size:16px; white-space:nowrap; }
    .grow { flex:1 1 auto; }
    .who { font-size:12px; color:var(--muted); }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
      font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .badge.admin  { background:#3b2a0b; color:var(--warn); border:1px solid #5a4514; }
    .badge.editor { background:#0e3b2e; color:var(--good); border:1px solid #14563f; }
    .badge.viewer { background:#0b2a3b; color:var(--accent); border:1px solid #14415a; }
    button.link { background:none; border:0; color:var(--muted); cursor:pointer;
      font-size:12px; text-decoration:underline; }
    button.small { padding:6px 13px; border:1px solid var(--line); border-radius:8px;
      background:var(--panel2); color:var(--text); cursor:pointer; font:inherit; font-size:12px; white-space:nowrap; }
    button.small:hover { border-color:var(--accent); }
    button.small:disabled { opacity:.5; cursor:default; }

    .wrap { max-width:1100px; margin:0 auto; padding:22px 16px 60px; }
    .intro { color:var(--muted); font-size:13px; margin:0 0 6px; }
    .meta { display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:var(--muted);
      font-size:12px; margin-bottom:16px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

    /* The directory: one tile per area, biggest first. */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; margin-bottom:22px; }
    .tile { text-align:left; padding:11px 13px; border-radius:11px; border:1px solid var(--line);
      background:var(--panel); color:var(--text); cursor:pointer; font:inherit; min-width:0; }
    .tile:hover { border-color:var(--accent); }
    .tile.on { border-color:var(--accent); background:rgba(56,189,248,.1); }
    .tile b { display:block; font-size:20px; font-weight:800; letter-spacing:.02em; }
    .tile span { display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tile.blocked { cursor:default; opacity:.55; }
    .tile.blocked:hover { border-color:var(--line); }

    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .head { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:13px 16px;
      border-bottom:1px solid var(--line); }
    .head h2 { margin:0; font-size:17px; }
    .head small { color:var(--muted); font-size:12px; }
    #q { flex:1 1 220px; min-width:0; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
      background:var(--panel2); color:var(--text); font:inherit; }
    #q:focus { outline:none; border-color:var(--accent); }
    .scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); white-space:nowrap; }
    td.num, th.num { text-align:right; white-space:nowrap; }
    tr.bin { cursor:pointer; }
    tr.bin:hover td { background:rgba(56,189,248,.05); }
    tr.bin td:first-child { white-space:nowrap; font-weight:700; }
    .caret { display:inline-block; width:14px; color:var(--muted); }
    .desc { color:var(--muted); }
    tr.item td { background:var(--panel2); font-size:13px; padding-top:7px; padding-bottom:7px; }
    tr.item td:first-child { padding-left:38px; }
    .chip { display:inline-block; padding:1px 8px; border-radius:999px; font-size:10px; font-weight:800;
      text-transform:uppercase; letter-spacing:.06em; border:1px solid var(--line); color:var(--muted);
      background:var(--bg); margin-right:4px; white-space:nowrap; }
    .more { padding:12px 16px; text-align:center; }
    .empty, .denied { padding:44px 20px; text-align:center; color:var(--muted); }
    .err { color:var(--err); }

    /* ── The rack view ─────────────────────────────────────────────────────────
       Drawn the way it looks standing in the aisle: steel uprights between bays,
       a blue load beam under every level, each pallet a block sitting on its
       beam with the wooden base showing. The colour of the block is the one
       loud thing on the page: how long the stock has sat, or how many pallets
       share the spot. */
    .viewtabs { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .viewtabs button { padding:7px 13px; border:0; background:var(--panel2); color:var(--muted);
      font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
    .viewtabs button + button { border-left:1px solid var(--line); }
    .viewtabs button.on { background:var(--accent); color:#04222f; font-weight:700; }
    .viewtabs button:focus-visible, .aisle:focus-visible, .walk:focus-visible, .other:focus-visible,
    .tile:focus-visible, button.small:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .aisles { display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);
      overflow-x:auto; }
    .aisle { flex:0 0 auto; padding:6px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
      color:var(--text); font:inherit; font-size:13px; font-weight:700; cursor:pointer; text-align:left; line-height:1.3; }
    .aisle small { display:block; color:var(--muted); font-size:11px; font-weight:400; }
    .aisle.on { border-color:var(--accent); background:rgba(56,189,248,.13); }
    .aisle .hit { color:#04222f; background:var(--warn); border-radius:999px; padding:0 6px; font-size:11px;
      font-weight:800; margin-left:6px; }
    .aisle.nohit { opacity:.38; }
    .walk { flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
      background:var(--panel2); color:var(--text); cursor:pointer; font-size:15px; }
    .walk:disabled { opacity:.3; cursor:default; }

    .facehead { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:16px 16px 0; }
    .facehead h3 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em; }
    .facehead small { color:var(--muted); font-size:12px; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); margin-left:auto; }
    .legend i { display:inline-block; width:15px; height:12px; border-radius:2px; margin-right:5px; vertical-align:-2px;
      box-shadow:inset 0 -3px 0 rgba(120,72,24,.6); }
    .modes { display:inline-flex; gap:4px; }
    .modes button { padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted);
      font:inherit; font-size:12px; cursor:pointer; }
    .modes button.on { color:var(--text); border-color:var(--muted); }

    .face { --row:40px; --col:42px; overflow-x:auto; padding:16px 16px 4px; }
    .rack { display:inline-flex; align-items:flex-start; }
    .face.walked .rack { animation:walk .28s ease-out; }
    @keyframes walk { from { transform:translateX(26px); opacity:.35; } to { transform:none; opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .face.walked .rack { animation:none; } }
    .lvls { position:sticky; left:-16px; z-index:2; display:grid; grid-auto-rows:var(--row);
      background:var(--panel); padding-right:8px; }
    .lvls span { display:flex; align-items:flex-end; justify-content:flex-end; padding-bottom:7px;
      font-size:12px; font-weight:800; color:var(--muted); }
    .bay { display:flex; flex-direction:column; }
    .bay-grid { display:grid; grid-auto-rows:var(--row); padding:0 3px;
      border-left:7px solid #64748b; border-right:7px solid #64748b; }
    .bay + .bay .bay-grid { border-left:0; }
    .bay-no { text-align:center; font-size:12px; color:var(--muted); padding-top:7px; white-space:nowrap; }
    .slot { position:relative; display:flex; align-items:flex-end; padding:5px 2px 0; border-bottom:4px solid #2563eb; }
    .slot.vacant::after { content:''; position:absolute; inset:9px 6px 4px; border:1px dashed rgba(148,163,184,.2); border-radius:3px; }
    .load { width:100%; height:100%; border:0; padding:0 0 5px; border-radius:3px 3px 1px 1px; cursor:pointer;
      background:var(--c); color:#0b1220; font:inherit; font-size:12px; font-weight:800;
      box-shadow:inset 0 -5px 0 rgba(120,72,24,.6); }
    .load:hover { filter:brightness(1.12); }
    .load:focus-visible, .load.sel { outline:3px solid #fff; outline-offset:1px; }
    .face.searching .load:not(.match) { opacity:.16; }
    .face.searching .load.match { outline:2px solid #fff; outline-offset:1px; }

    .spotinfo { margin:10px 16px 16px; border:1px solid var(--line); border-radius:11px; background:var(--panel2); overflow:hidden; }
    .spotinfo h4 { margin:0; padding:11px 14px; font-size:15px; border-bottom:1px solid var(--line);
      display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
    .spotinfo h4 small { color:var(--muted); font-weight:400; font-size:12px; }
    .spotinfo tr.item td { background:none; }
    .spotinfo tr.item td:first-child { padding-left:14px; }
    .hint { padding:2px 16px 16px; font-size:12px; color:var(--muted); }
    .others { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; padding:16px; }
    .other { text-align:left; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
      color:var(--text); font:inherit; cursor:pointer; min-width:0; }
    .other b { display:block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; overflow-wrap:anywhere; }
    .other span { color:var(--muted); font-size:12px; }
    .other.sel { border-color:#fff; }
    .other.dim { opacity:.3; }
    .aisles, .face, .scroll { scrollbar-width:thin; scrollbar-color:#475569 transparent; }
    @media (max-width:560px) {
      .face { --row:36px; --col:36px; }
      .legend { margin-left:0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏭 Other areas</h1>
    <a href="/">← Back to feed</a>
    <div class="grow"></div>
    <span class="who" id="who"></span>
    <button class="link" id="logout">Sign out</button>
  </header>

  <div class="wrap" id="wrap">
    <p class="intro">The rest of the warehouse, read straight from Swarmbox when you open an area. Read-only, and
      separate from the feed and the dashboard: nothing here changes a task, a group or the rack map.</p>
    <div class="meta"><span id="surveyed">Reading the list of areas from Swarmbox — about 10 seconds…</span>
      <button class="small" id="rescan" disabled title="Re-read which areas exist and how big each one is">⟳ Rescan areas</button></div>

    <div class="grid" id="grid"></div>
    <div id="area"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fmtInt = (n) => Math.round(n).toLocaleString();
    const fmtQty = (n) => (Math.abs(n % 1) < 1e-9 ? Math.round(n).toLocaleString()
      : n.toLocaleString(undefined, { maximumFractionDigits: 2 }));
    const plural = (n, w) => `${fmtInt(n)} ${w}${n === 1 ? '' : 's'}`;
    const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    // Whole days since a YYYY-MM-DD, read as a LOCAL day (see today.js on why
    // `new Date(str)` is the wrong tool for a date with no time on it).
    function daysSince(s) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
      if (!m) return null;
      const then = new Date(+m[1], +m[2] - 1, +m[3]);
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      return Math.round((now - then) / 86400000);
    }
    const dated = (s) => (s ? `${esc(String(s).slice(0, 10))}${daysSince(s) != null ? ` (${fmtInt(daysSince(s))}d)` : ''}` : '—');

    const PAGE = 100;
    let DIR = null;          // the directory of areas
    let AREA = null;         // the area on screen
    let WANT = '';           // the area last asked for — a slow answer to an older click is dropped
    let SHOWN = PAGE;
    const OPEN = new Set();  // bins expanded by hand

    async function api(method, url) {
      const res = await fetch(url, { method });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || `Could not load (${res.status})`);
      return j;
    }

    function drawDir() {
      $('surveyed').innerHTML = `${esc(plural(DIR.areas.length, 'area'))} besides <b>${esc(DIR.home)}</b> · list read `
        + `${esc(new Date(DIR.surveyedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}`
        + (DIR.stale ? ` · <span class="err">could not re-read it just now</span>` : '');
      $('rescan').disabled = false;
      $('grid').innerHTML = DIR.areas.map((a) => `
        <button class="tile${a.blocked ? ' blocked' : ''}${a.prefix === WANT ? ' on' : ''}"
          ${a.blocked ? `disabled title="${esc(a.blocked)}"` : `data-area="${esc(a.prefix)}"`}>
          <b>${esc(a.prefix)}</b>
          <span>${esc(plural(a.bins, 'bin'))}</span>
          <span>${a.blocked ? 'bulk — not opened' : esc(plural(a.pallets, 'pallet'))}</span>
        </button>`).join('');
    }

    const qtyStr = (qty) => (qty && qty.length ? qty.map((x) => `${fmtQty(x.qty)} ${esc(x.uom)}`).join(' · ') : '—');

    // ── Rack view ───────────────────────────────────────────────────────────────
    // Swarmbox has no floor plan — only bin codes — so the racking is drawn from
    // the code itself. Read the way the floor reads it: F.A.03.E01 is aisle A,
    // bay 03, level E (A is the floor, going up), spot 01 across the bay. Codes
    // whose middle part carries its own letter (JF.1.C03.G06, GT.2.Z4.B03) name
    // the aisle with it: aisle 1-C, bay 03. Anything else — floors, docks, desks
    // — is not racking and is listed under "Floor & other" rather than guessed at.
    //
    // Swarmbox only returns bins with stock in them, so an empty spot is drawn
    // from the shape of the bay around it (every level up to the highest seen
    // in the aisle, every spot up to the widest seen in the bay). It may be an
    // empty spot or a place no pallet goes — the page says "nothing recorded".
    let VIEW = 'racks';
    let MODE = 'age';
    try {
      if (localStorage.getItem('areas.view') === 'list') VIEW = 'list';
      if (localStorage.getItem('areas.colour') === 'pallets') MODE = 'pallets';
    } catch (_) { /* a private window: fall back to the defaults */ }
    const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* not kept, harmless */ } };
    const OTHER = '~other';
    let LAYOUT = null;   // the area folded into aisles and bays
    let BYCODE = new Map();
    let AISLE = null;    // the aisle being looked down
    let PICK = null;     // the bin whose pallets are open under the rack
    let DRAWN = null;    // the aisle last drawn — the walk animation plays only on a change

    function parseBin(code) {
      const s = code.split('.');
      if (s.length !== 4) return null;
      const lv = /^([A-Z])(\d{1,3})$/.exec(s[3]);
      if (!lv) return null;
      const lettered = /^([A-Z])(\d{1,3})$/.exec(s[2]);
      if (lettered) return { aisle: `${s[1]}-${lettered[1]}`, bay: lettered[2], level: lv[1], spot: Number(lv[2]) };
      if (/^\d{1,3}$/.test(s[2])) return { aisle: s[1], bay: s[2], level: lv[1], spot: Number(lv[2]) };
      return null;
    }

    function buildLayout(area) {
      const aisles = new Map();
      const other = [];
      for (const l of area.locations) {
        const p = parseBin(l.code);
        if (!p) { other.push(l); continue; }
        let a = aisles.get(p.aisle);
        if (!a) { a = { name: p.aisle, bays: new Map(), top: 'A', bins: [] }; aisles.set(p.aisle, a); }
        let b = a.bays.get(p.bay);
        if (!b) { b = { name: p.bay, lo: p.spot, hi: p.spot, at: new Map() }; a.bays.set(p.bay, b); }
        b.lo = Math.min(b.lo, p.spot);
        b.hi = Math.max(b.hi, p.spot);
        b.at.set(`${p.level}${p.spot}`, l);
        if (p.level > a.top) a.top = p.level;
        a.bins.push(l);
      }
      const nat = (x, y) => x.localeCompare(y, undefined, { numeric: true });
      const list = [...aisles.values()].sort((x, y) => nat(x.name, y.name));
      for (const a of list) a.bayList = [...a.bays.values()].sort((x, y) => nat(x.name, y.name));
      return { aisles: list, other };
    }

    // How long the oldest stock in a bin has sat: the state's "since" date when
    // there is one (tempering since…), otherwise the date it was received.
    function ageOf(l) {
      let days = null;
      for (const it of l.items) {
        const d = daysSince(it.since || it.received);
        if (d != null && (days == null || d > days)) days = d;
      }
      return days;
    }
    const AGE = [[14, '#2dd4bf', 'under 2 weeks'], [60, '#facc15', '2 weeks – 2 months'],
      [180, '#fb923c', '2 – 6 months'], [Infinity, '#f87171', 'over 6 months']];
    const FILL = [[1, '#bae6fd', '1 pallet'], [3, '#7dd3fc', '2–3'], [9, '#38bdf8', '4–9'], [Infinity, '#0ea5e9', '10 or more']];
    function colourOf(l) {
      if (MODE === 'pallets') return FILL.find(([max]) => l.pallets <= max)[1];
      const d = ageOf(l);
      return d == null ? '#94a3b8' : AGE.find(([max]) => d < max)[1];
    }
    const legend = () => (MODE === 'pallets' ? FILL : AGE)
      .map(([, c, label]) => `<span><i style="background:${c}"></i>${esc(label)}</span>`).join('');

    const query = () => ($('q') ? $('q').value.trim().toLowerCase() : '');
    const matches = (l, q) => !q || l.code.toLowerCase().includes(q)
      || l.items.some((it) => `${it.item} ${it.description}`.toLowerCase().includes(q));

    function binTitle(l) {
      const age = ageOf(l);
      const first = l.items[0];
      return `${l.code} — ${plural(l.pallets, 'pallet')}`
        + (first ? `, ${first.item} ${first.description}` : '')
        + (l.items.length > 1 ? ` (+${l.items.length - 1} more products)` : '')
        + (age != null ? `, oldest ${age} days` : '');
    }

    function itemRows(items) {
      return items.map((it) => `<tr class="item">
            <td class="mono">${esc(it.item)}</td>
            <td class="num">${fmtInt(it.pallets)}</td>
            <td class="desc">${esc(it.description)}</td>
            <td class="num">${qtyStr(it.qty)}</td>
            <td>${it.states.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}${it.since ? `<span class="desc">since ${dated(it.since)}</span>` : ''}</td>
            <td class="desc">${dated(it.received)}</td>
          </tr>`).join('');
    }

    function spotInfo() {
      const l = PICK && BYCODE.get(PICK);
      if (!l) return '<div class="hint">Tap a pallet to see what is on it.</div>';
      const p = parseBin(l.code);
      return `<div class="spotinfo" id="spotinfo">
        <h4><span class="mono">${esc(l.code)}</span>
          <small>${p ? `aisle ${esc(p.aisle)}, bay ${esc(p.bay)}, level ${esc(p.level)}, spot ${esc(String(p.spot))} — ` : ''}${esc(plural(l.pallets, 'pallet'))}</small>
          <span class="grow"></span><button class="small" data-unpick="1">Close</button></h4>
        <div class="scroll"><table>
          <thead><tr><th>Item</th><th class="num">Pallets</th><th>Description</th><th class="num">Quantity</th><th>State</th><th>Received</th></tr></thead>
          <tbody>${itemRows(l.items)}</tbody>
        </table></div>
      </div>`;
    }

    function drawRacks() {
      const q = query();
      const tabs = LAYOUT.aisles.map((a) => ({ key: a.name, label: `Aisle ${a.name}`,
        sub: plural(a.bins.length, 'bin'), hits: q ? a.bins.filter((l) => matches(l, q)).length : 0 }));
      if (LAYOUT.other.length) {
        tabs.push({ key: OTHER, label: 'Floor & other', sub: plural(LAYOUT.other.length, 'spot'),
          hits: q ? LAYOUT.other.filter((l) => matches(l, q)).length : 0 });
      }
      if (!tabs.length) { $('body').innerHTML = '<div class="empty">Nothing on hand in this area.</div>'; return; }
      if (!tabs.some((t) => t.key === AISLE)) AISLE = tabs[0].key;
      // Searching walks you to the first aisle that has it, unless this one does.
      if (q && !tabs.find((t) => t.key === AISLE).hits) {
        const h = tabs.find((t) => t.hits);
        if (h) { AISLE = h.key; PICK = null; }
      }
      const total = tabs.reduce((n, t) => n + t.hits, 0);
      $('count').textContent = q ? `${plural(total, 'bin')} match` : '';
      const i = tabs.findIndex((t) => t.key === AISLE);

      const strip = `<div class="aisles">
        <button class="walk" data-walk="-1" ${i <= 0 ? 'disabled' : ''} title="Previous aisle (←)" aria-label="Previous aisle">◀</button>
        ${tabs.map((t) => `<button class="aisle${t.key === AISLE ? ' on' : ''}${q && !t.hits ? ' nohit' : ''}" data-aisle="${esc(t.key)}">
          ${esc(t.label)}${t.hits ? `<span class="hit">${fmtInt(t.hits)}</span>` : ''}<small>${esc(t.sub)}</small></button>`).join('')}
        <button class="walk" data-walk="1" ${i >= tabs.length - 1 ? 'disabled' : ''} title="Next aisle (→)" aria-label="Next aisle">▶</button>
      </div>`;

      const old = document.querySelector('.face');
      const keepScroll = old && DRAWN === AISLE ? old.scrollLeft : 0;
      const walked = DRAWN !== AISLE;
      DRAWN = AISLE;

      let view;
      if (AISLE === OTHER) {
        view = `<div class="facehead"><h3>Floor &amp; other spots</h3>
            <small>Docks, floors, desks and anything else whose code is not a rack position</small></div>
          <div class="others">${LAYOUT.other.map((l) => `<button class="other${PICK === l.code ? ' sel' : ''}${q && !matches(l, q) ? ' dim' : ''}"
            data-bin="${esc(l.code)}" title="${esc(binTitle(l))}"><b>${esc(l.code)}</b><span>${esc(plural(l.pallets, 'pallet'))}</span></button>`).join('')}</div>`;
      } else {
        const a = LAYOUT.aisles.find((x) => x.name === AISLE);
        const levels = [];
        for (let c = a.top.charCodeAt(0); c >= 65; c--) levels.push(String.fromCharCode(c));
        const pallets = a.bins.reduce((n, l) => n + l.pallets, 0);
        const bays = a.bayList.map((b) => {
          const start = Math.min(1, b.lo);
          const cells = [];
          for (const L of levels) {
            for (let s = start; s <= b.hi; s++) {
              const l = b.at.get(`${L}${s}`);
              cells.push(l
                ? `<div class="slot"><button class="load${PICK === l.code ? ' sel' : ''}${q && matches(l, q) ? ' match' : ''}"
                    style="--c:${colourOf(l)}" data-bin="${esc(l.code)}" title="${esc(binTitle(l))}"
                    aria-label="${esc(binTitle(l))}">${l.pallets ? fmtInt(l.pallets) : '•'}</button></div>`
                : `<div class="slot vacant" title="${esc(`${L}${String(s).padStart(2, '0')} — nothing recorded`)}"></div>`);
            }
          }
          return `<div class="bay"><div class="bay-grid" style="grid-template-columns:repeat(${b.hi - start + 1},var(--col))">${cells.join('')}</div>
            <div class="bay-no">Bay ${esc(b.name)}</div></div>`;
        }).join('');
        view = `<div class="facehead"><h3>Aisle ${esc(a.name)}</h3>
            <small>${esc(plural(a.bayList.length, 'bay'))}, levels A–${esc(a.top)}, ${esc(plural(a.bins.length, 'bin'))} with ${esc(plural(pallets, 'pallet'))}</small>
            <div class="legend"><span class="modes">
              <button data-mode="age" class="${MODE === 'age' ? 'on' : ''}">Colour by age</button>
              <button data-mode="pallets" class="${MODE === 'pallets' ? 'on' : ''}">by pallets</button></span>${legend()}
              <span><i style="background:none;box-shadow:none;border:1px dashed rgba(148,163,184,.5)"></i>nothing recorded</span></div></div>
          <div class="face${q ? ' searching' : ''}${walked ? ' walked' : ''}">
            <div class="rack"><div class="lvls" style="padding-top:0">${levels.map((L) => `<span>${L}</span>`).join('')}</div>${bays}</div>
          </div>`;
      }
      $('body').innerHTML = strip + view + spotInfo();
      const face = document.querySelector('.face');
      if (face && keepScroll) face.scrollLeft = keepScroll;
      const on = document.querySelector('.aisle.on');
      if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function walk(step) {
      const keys = LAYOUT.aisles.map((a) => a.name).concat(LAYOUT.other.length ? [OTHER] : []);
      const i = keys.indexOf(AISLE) + step;
      if (i < 0 || i >= keys.length) return;
      AISLE = keys[i];
      PICK = null;
      drawArea();
    }

    function drawArea() {
      if (!AREA) return;
      if (VIEW === 'racks') { drawRacks(); return; }
      if (!$('rows')) {
        $('body').innerHTML = `<div class="scroll"><table>
          <thead><tr><th>Bin / item</th><th class="num">Pallets</th><th>Products</th><th class="num">Quantity</th><th>State</th><th>Received</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div class="more" id="more"></div>`;
      }
      const q = query();
      // A bin matches on its own code, or on any product in it. Matched on a
      // product, it opens itself and lists only what matched — "where in JF is
      // 062065" should not need a click per bin to answer.
      const rows = [];
      for (const l of AREA.locations) {
        if (!q) { rows.push({ l, items: l.items, forced: false }); continue; }
        if (l.code.toLowerCase().includes(q)) { rows.push({ l, items: l.items, forced: false }); continue; }
        const hit = l.items.filter((it) => `${it.item} ${it.description}`.toLowerCase().includes(q));
        if (hit.length) rows.push({ l, items: hit, forced: true });
      }
      const body = rows.slice(0, SHOWN).map(({ l, items, forced }) => {
        const open = forced || OPEN.has(l.code);
        const sum = new Map();
        for (const it of l.items) for (const x of it.qty) sum.set(x.uom, (sum.get(x.uom) || 0) + x.qty);
        const codes = l.items.slice(0, 3).map((it) => it.item).join(' · ')
          + (l.items.length > 3 ? ` +${l.items.length - 3}` : '');
        return `<tr class="bin" data-bin="${esc(l.code)}">
            <td class="mono"><span class="caret">${open ? '▾' : '▸'}</span>${esc(l.code)}</td>
            <td class="num">${fmtInt(l.pallets)}</td>
            <td><span class="mono">${esc(codes)}</span></td>
            <td class="num">${qtyStr([...sum].map(([uom, qty]) => ({ uom, qty })))}</td>
            <td></td><td></td>
          </tr>` + (open ? itemRows(items) : '');
      }).join('');
      const rest = rows.length - Math.min(rows.length, SHOWN);
      $('rows').innerHTML = body || `<tr><td colspan="6" class="empty">${q ? 'Nothing in this area matches that.' : 'Nothing on hand in this area.'}</td></tr>`;
      $('count').textContent = q ? `${plural(rows.length, 'bin')} match` : '';
      $('more').innerHTML = rest ? `<button class="small" id="showmore">Show ${fmtInt(Math.min(rest, PAGE))} more of ${fmtInt(rest)}</button>` : '';
    }

    function frame() {
      $('area').innerHTML = `<div class="card">
        <div class="head">
          <h2>${esc(AREA.prefix)}</h2>
          <small>${esc(plural(AREA.locations.length, 'bin'))} · ${esc(plural(AREA.pallets, 'pallet'))} · as of ${esc(clock(AREA.builtAt))}</small>
          <button class="small" id="fresh" title="Read this area from Swarmbox again">⟳ Refresh</button>
          <span class="viewtabs">
            <button data-view="racks" class="${VIEW === 'racks' ? 'on' : ''}">Racks</button>
            <button data-view="list" class="${VIEW === 'list' ? 'on' : ''}">List</button></span>
          <input id="q" type="search" placeholder="Find a bin, item code or description" autocomplete="off">
          <small id="count"></small>
        </div>
        <div id="body"></div>
      </div>`;
      drawArea();
    }

    async function openArea(prefix, fresh) {
      WANT = prefix;
      if (!fresh) { OPEN.clear(); SHOWN = PAGE; }
      drawDir();
      if (!fresh || !AREA) {
        AREA = null;
        $('area').innerHTML = `<div class="card"><div class="empty">Reading <b>${esc(prefix)}</b> from Swarmbox — a few seconds…</div></div>`;
      }
      try {
        const a = await api('GET', `/api/areas/${encodeURIComponent(prefix)}${fresh ? '?fresh=1' : ''}`);
        if (WANT !== prefix) return;
        const q = $('q') ? $('q').value : '';
        AREA = a;
        LAYOUT = buildLayout(a);
        BYCODE = new Map(a.locations.map((l) => [l.code, l]));
        // A refresh keeps you standing where you were; a new area starts at its first aisle.
        if (!fresh) { AISLE = null; PICK = null; DRAWN = null; }
        frame();
        // The area opens under the wall of tiles; bring it up to where you are looking.
        if (!fresh) $('area').scrollIntoView({ block: 'start' });
        if (q) { $('q').value = q; drawArea(); }
      } catch (err) {
        if (WANT !== prefix) return;
        AREA = null;
        $('area').innerHTML = `<div class="card"><div class="empty err">${esc(err.message)}</div></div>`;
      }
    }

    $('grid').addEventListener('click', (e) => {
      const t = e.target.closest('[data-area]');
      if (t) openArea(t.dataset.area);
    });
    $('area').addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (b && b.id === 'showmore') { SHOWN += PAGE; drawArea(); return; }
      if (b && b.dataset.view) {
        VIEW = b.dataset.view;
        remember('areas.view', VIEW);
        DRAWN = null;
        frame();
        return;
      }
      if (b && b.dataset.mode) { MODE = b.dataset.mode; remember('areas.colour', MODE); drawArea(); return; }
      if (b && b.dataset.aisle) { AISLE = b.dataset.aisle; PICK = null; drawArea(); return; }
      if (b && b.dataset.walk) { walk(Number(b.dataset.walk)); return; }
      if (b && b.dataset.unpick) { PICK = null; drawArea(); return; }
      if (b && b.dataset.bin) {
        PICK = PICK === b.dataset.bin ? null : b.dataset.bin;
        drawArea();
        const info = $('spotinfo');
        if (info) info.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }
      if (b && b.id === 'fresh') {
        b.disabled = true;
        b.textContent = '⟳ refreshing…';
        await openArea(AREA.prefix, true);
        return;
      }
      const row = e.target.closest('tr.bin');
      if (!row) return;
      const code = row.dataset.bin;
      if (!OPEN.delete(code)) OPEN.add(code);
      drawArea();
    });
    $('area').addEventListener('input', (e) => {
      if (e.target.id === 'q') { SHOWN = PAGE; drawArea(); }
    });
    // ← and → walk from aisle to aisle, except while typing in the search box.
    document.addEventListener('keydown', (e) => {
      if (!AREA || VIEW !== 'racks' || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
      if (e.key === 'ArrowLeft') { walk(-1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { walk(1); e.preventDefault(); }
    });

    $('rescan').addEventListener('click', async () => {
      const btn = $('rescan');
      btn.disabled = true;
      btn.textContent = '⟳ rescanning…';
      let msg = '';
      try { DIR = await api('POST', '/api/areas/rescan'); } catch (err) { msg = err.message; }
      btn.textContent = '⟳ Rescan areas';
      drawDir();
      if (msg) $('surveyed').innerHTML += ` · <span class="err">${esc(msg)}</span>`;
    });

    $('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login.html';
    });

    (async function init() {
      let me;
      try {
        me = await (await fetch('/api/session')).json();
      } catch (_) { location.href = '/login.html'; return; }
      $('who').innerHTML = `${esc(me.username)} <span class="badge ${esc(me.role)}">${esc(me.role)}</span>`;
      if (me.role !== 'admin') {
        $('wrap').innerHTML = '<div class="denied">Only admins can open other areas.<br><a href="/">← Back to the feed</a></div>';
        return;
      }
      try {
        DIR = await api('GET', '/api/areas');
        drawDir();
      } catch (err) {
        $('surveyed').innerHTML = `<span class="err">${esc(err.message)}</span>`;
      }
    })();
  </script>
</body>
</html>
